name: Deploy landing to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'apps/landing/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build static site folder
        working-directory: apps/landing
        run: |
          mkdir -p _site
          cp -r index.html privacy.html terms.html tokens.css styles.css config.js i18n.js app.js motion.js favicon.svg assets .nojekyll _site/
          base64 -d og-image.png.b64 > _site/og-image.png
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/landing/_site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
