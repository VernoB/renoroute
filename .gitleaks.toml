title = "RenoRoute"

[extend]
useDefault = true

[allowlist]
description = "Ignore dependency locks and placeholder values only."
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)pnpm-lock\.yaml$''',
]
regexes = [
  '''replace[-_]?me''',
  '''replace-with-[a-z-]+''',
  '''never-use-in-apps-folder''',
  '''you@example\.com''',
]
